[project]
name = "blackice"
version = "0.1.0"
description = "Custom pentester engine"
authors = [
    {name = "gwimbly03",email = "dbalsara2003@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "uvicorn (>=0.41.0,<0.42.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "readchar (>=4.2.1,<5.0.0)",

    "requests",
    "rich",
    "scapy",
    "psutil",
    "pyyaml",
    "cryptography",
    "pyOpenSSL",
    "dnspython",
    "beautifulsoup4",
    "python-dateutil",
    "networkx",
    "matplotlib",
    "pysnmp",
    "orjson",
    "websockets"
]

[tool.poetry.scripts]
blackice = "main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
